<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Erandel: an open-world fantasy action RPG you play together in the browser. Choose one of 36 kinds, fight, climb, build and meet other players.">
<meta property="og:title" content="Erandel">
<meta property="og:description" content="Open-world fantasy action RPG in your browser. 36 kinds, live combat, climbing, building and multiplayer.">
<meta name="theme-color" content="#0e1222">
<style>[hidden]{display:none!important}html,body{margin:0;padding:0;background:#0e1222}</style>
</head>
<body>
<title>Erandel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a wanderer's field journal. Status sigil on top, sticky page tabs, one page of the journal below. Single night look by design. */
:root{
  --bg:#11131b; --panel:#181b26; --panel2:#1f2331; --line:#2c3144;
  --fg:#ebe4d1; --mut:#9d9aab; --gold:#d9aa52; --fate:#7fc3e4; --corr:#c65f86; --hp:#d4735f; --good:#86c48a;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:2.4rem}
h2{font-size:1.7rem}
h3{font-size:1.25rem;color:var(--gold)}
p{margin:0}
.mut{color:var(--mut)}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
.btn:disabled,.act:disabled{opacity:.42;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > select{flex:1 1 160px}
section{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line)}
section:first-child{border-top:0}
.el{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-family:var(--mono);padding:1px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);white-space:nowrap}
.el::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* HUD */
.hud{display:grid;gap:12px;padding-bottom:14px}
.hud-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.hud .title{font-family:var(--display);font-size:1.25rem;color:var(--gold)}
.when{text-align:right;display:grid;gap:2px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.meter{display:grid;gap:4px}
.meter-l{display:flex;justify-content:space-between;font-size:.85rem}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold)}
.pip.on{background:var(--gold)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--mut);font-weight:500;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--gold)}

/* Actions */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{display:grid;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.act:hover:not(:disabled){border-color:var(--gold)}
.act b{font-weight:700}
.act small{color:var(--mut);font-size:.8rem;line-height:1.3}
.act.dark{border-color:color-mix(in srgb,var(--corr) 45%,var(--line))}
.act.kind{border-color:color-mix(in srgb,var(--fate) 40%,var(--line))}
.warn{color:var(--hp);font-size:.9rem}
.sleep{justify-self:start}
.npc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.npc-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.att{font-family:var(--mono);font-size:.78rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.log{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.log li{font-size:.95rem;padding-left:12px;border-left:2px solid var(--line)}
.log li.gold{border-color:var(--gold);color:var(--gold)}
.log li.evo{border-color:var(--gold);color:var(--fg);font-weight:700}
.log li.good{border-color:var(--fate)}
.log li.dark{border-color:var(--corr)}
.log li.dawn{border-color:transparent;padding-left:0;font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.log li.mutl{color:var(--mut)}

/* Self */
.stat{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:.92rem}
.tree{display:grid;gap:6px}
.tier{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.tier .kicker{padding-top:3px}
.node{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:6px;margin:0 4px 4px 0;font-size:.9rem}
.node.cur{border-color:var(--gold);color:var(--gold)}
.node.lean{border-style:dashed;border-color:var(--gold)}
.node.dim{opacity:.55}
.req{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92rem}
.req li::before{content:"○ ";color:var(--mut)}
.req li.ok::before{content:"● ";color:var(--good)}
.aff{display:grid;grid-template-columns:100px 1fr 74px;gap:10px;align-items:center;font-size:.9rem}
.aff .lvl{font-family:var(--mono);font-size:.75rem;color:var(--mut);text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}

/* Magic */
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.src{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px;font-size:.9rem}
.src.on{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.src b{font-weight:700}
.forge{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.forge label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
.spell{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.spell-name{font-family:var(--display);font-size:1.2rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:400}

/* Create */
.create-head{display:grid;gap:8px;padding-block:10px 4px}
.create-head h1{font-size:clamp(2.4rem,8vw,3.6rem)}
.race-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.race{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;display:grid;gap:3px}
.race.sel{border-color:var(--gold);background:var(--panel2)}
.race b{font-family:var(--display);font-weight:500;font-size:1.1rem}
.detail{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:16px;display:grid;gap:10px}
.paths{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;max-width:min(92vw,520px);z-index:20;box-shadow:0 8px 30px #0008}
.confirm{border:1px solid var(--corr);border-radius:8px;padding:12px;display:grid;gap:8px}
@media (max-width:520px){h1{font-size:2rem}.when{text-align:left}.stat{grid-template-columns:84px 1fr 40px}.aff{grid-template-columns:84px 1fr 66px}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}

/* ===== Erandel: HD-2D world layer ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{touch-action:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
#tilt::before,#tilt::after{content:"";position:fixed;left:0;right:0;height:22%;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
#tilt::before{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#tilt::after{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(8,10,20,.45) 100%)}
#under{position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(rgba(40,140,170,.28),rgba(10,60,90,.42));opacity:0;transition:opacity .6s}
body.under #under{opacity:1}
#app{position:fixed;inset:0;z-index:3;pointer-events:none;max-width:none;margin:0;padding:0}
#app .pe,#app .pe *{pointer-events:auto}
.hud3{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.hcard{background:linear-gradient(rgba(16,20,36,.86),rgba(16,20,36,.72));border:1px solid rgba(217,170,82,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);border-radius:8px;padding:8px 10px;min-width:0;max-width:min(54vw,300px);color:var(--fg)}
.hcard.right{text-align:right;max-width:min(42vw,240px)}
.hname{font-family:var(--display);font-size:1.15rem;line-height:1.1;overflow-wrap:anywhere}
.htitle{color:var(--gold);font-size:.85rem;margin-bottom:5px}
.hreg{font-family:var(--display);font-size:1.15rem;line-height:1.1;margin:2px 0 4px}
.hcard .pips{justify-content:flex-end}
.hcard .pip{width:11px;height:11px}
.mb{display:grid;grid-template-columns:34px 1fr 30px;gap:6px;align-items:center;font-size:.72rem;font-family:var(--mono);margin-top:3px}
.mb .bar{height:6px}
.mb b{font-weight:400;text-align:right}
.banner{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;width:min(90vw,560px);animation:bannerIn 3.2s ease forwards;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.bname{font-family:var(--display);font-size:clamp(2rem,8vw,3.2rem);color:#fff6dc;line-height:1.05}
.bsub{font-style:italic;color:#f0e6cc}
.banner::before,.banner::after{content:"";display:block;height:1px;margin:8px auto;width:70%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#controls[hidden]{display:none!important}
#controls{position:fixed;inset:auto 0 0 0;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#stick{pointer-events:auto;width:128px;height:128px;border-radius:50%;background:radial-gradient(rgba(16,20,36,.35),rgba(16,20,36,.6));border:2px solid rgba(217,170,82,.5);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d38a,#b58630);box-shadow:0 3px 10px rgba(0,0,0,.5)}
#btns{pointer-events:auto;display:grid;gap:10px;justify-items:end}
#btns button{font:inherit;font-family:var(--display);font-size:1.1rem;color:var(--fg);background:linear-gradient(rgba(16,20,36,.9),rgba(16,20,36,.75));border:1px solid var(--gold);border-radius:10px;padding:12px 18px;min-width:92px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btns button:disabled{opacity:.45}
.dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100vw - 24px),720px);display:flex;gap:12px;background:linear-gradient(rgba(14,18,34,.95),rgba(14,18,34,.9));border:2px solid var(--gold);box-shadow:inset 0 0 0 3px rgba(14,18,34,.95),inset 0 0 0 4px rgba(217,170,82,.4),0 10px 40px rgba(0,0,0,.55);border-radius:10px;padding:14px;max-height:62vh;overflow:auto}
.portrait{flex:0 0 auto;width:84px;height:84px;border-radius:8px;border:1px solid var(--gold);background-size:auto 100%;background-position:16% 30%;background-color:#0e1222}
.portrait.sig{display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;color:var(--c);background:radial-gradient(color-mix(in srgb,var(--c) 30%,transparent),#0e1222 70%)}
.dbody{min-width:0;display:grid;gap:8px;flex:1}
.dname{font-family:var(--display);font-size:1.25rem;color:var(--gold)}
.dtext{font-size:1rem;line-height:1.5}
.dres{display:block;margin-top:8px;color:var(--fate)}
.dch{display:grid;gap:6px}
.choice{text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:7px 10px;color:var(--fg)}
.choice::before{content:"\25B8  ";color:var(--gold)}
.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--gold);background:rgba(217,170,82,.08)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.journal{position:absolute;inset:0;background:rgba(12,14,24,.94);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.jin{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px}
.journal .tabs{top:0}
.threshold{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(rgba(10,12,22,.55),rgba(10,12,22,.92) 30%)}
.tin{max-width:900px;margin:0 auto;display:grid;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) 60px}
.thero{aspect-ratio:16/8;max-width:100%;border-radius:12px;border:1px solid var(--gold);background-size:cover;background-position:30% 40%;position:relative;overflow:hidden}
.thero-txt{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(8,12,10,.85))}
.thero h1{font-size:clamp(2.6rem,10vw,4.4rem);color:#f6efd8;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.speech{background:rgba(14,18,34,.9);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease forwards}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.fade{position:absolute;inset:0;background:#05060c;display:grid;place-items:center;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{z-index:30;bottom:auto;top:calc(150px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){.banner,.flash,.fade{animation:none}.flash{opacity:0}}
@media (max-width:520px){.portrait{width:60px;height:60px}.dialog{padding:10px;gap:10px}#stick{width:116px;height:116px}}

/* ===== cozy diorama UI (video style) ===== */
.ic{width:20px;height:20px;flex:0 0 auto}
.hud3{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px}
.hud3 .hl{justify-self:start;max-width:min(46vw,290px);padding:8px 10px}
.hc{display:grid;justify-items:center;gap:6px;text-align:center}
.counters{display:flex;gap:14px;background:rgba(14,16,28,.62);border:1px solid rgba(217,170,82,.35);border-radius:99px;padding:6px 14px;color:#f3ead2}
.counters span{display:inline-flex;align-items:center;gap:5px}
.counters .ic.g{color:#f0c050}.counters .ic.w{color:#c8915a}.counters .ic.s{color:#b8bcc4}
.counters b{font-weight:500;font-size:.95rem}
.pill{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:.9rem;color:#f3ead2;background:rgba(14,16,28,.78);border:1px solid rgba(217,170,82,.7);border-radius:99px;padding:6px 14px;cursor:pointer}
.pill.on{background:rgba(217,140,60,.28);border-color:#ffb860}
.pill:hover{border-color:#ffd890}
.hreg{font-family:var(--display);font-size:1rem;color:#f3ead2;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.hcard .hrow .pips{justify-content:flex-start}
.hr{justify-self:end;display:grid;justify-items:end;gap:8px;position:relative}
.music{display:flex;align-items:center;gap:6px;background:rgba(14,16,28,.72);border:1px solid rgba(217,170,82,.4);border-radius:8px;padding:5px 6px;color:#f3ead2}
.mcov{width:30px;height:30px;border-radius:5px;background:linear-gradient(135deg,#2f6a3a,#14304a 60%,#c8a850);flex:0 0 auto}
.mt{display:grid;line-height:1.15;min-width:0;max-width:120px}
.mt b{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt span{font-size:.68rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb2{background:none;border:0;color:#f3ead2;padding:4px;border-radius:4px;display:grid;place-items:center}
.mb2 .ic{width:15px;height:15px}
.mb2:hover{background:rgba(255,255,255,.08)}
.icol{display:grid;gap:8px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;background:rgba(14,16,28,.72);border:1px solid rgba(217,170,82,.45);border-radius:10px;color:#f3ead2;cursor:pointer}
.ibtn:hover{border-color:#ffd890}
.ibtn.on{background:rgba(217,90,60,.35);border-color:#ff8a6a}
.ibtn.ok{background:rgba(120,200,120,.25);border-color:#9af0a0}
.ibtn.dim{opacity:.5}
.tools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:grid;gap:10px}
.settings{position:absolute;top:100%;right:0;margin-top:8px;display:grid;gap:8px;width:200px;background:rgba(14,16,28,.95);border:1px solid var(--gold);border-radius:10px;padding:12px;z-index:5}
.settings input[type=range]{width:100%;accent-color:var(--gold)}

/* ============ MAGIC ============ */
function usableSources(){return S.sources;}
function fusionWord(a,b){const k=[a,b].sort().join('+');return FUSION[k]||`${ELEM[a].adj}-${ELEM[b].adj}`;}
function autoName(e1,e2,form){if(!e1||!FORMS[form])return'';return `${e2?fusionWord(e1,e2):ELEM[e1].adj} ${FORMS[form].noun}`;}
function codexKey(sp){return `${sp.src}|${[sp.e1,sp.e2].filter(Boolean).sort().join('+')}|${sp.form}`;}
function spellPower(sp){
 const src=SRC[sp.src];const st=S.stats[src.stat];
 const aff=sp.e2?(S.aff[sp.e1]+S.aff[sp.e2])/2+5:S.aff[sp.e1];
 let p=5+st*0.6+aff*0.3;
 if(sp.src==='nature'){if(S.region==='vael')p*=0.6;else if(['greenmere','moonwell','coral'].includes(S.region))p*=1.3;}
 if(sp.src==='runes')p*=1.15;
 return p;
}
function spellUsable(sp){return!(sp.src==='faith'&&S.corr>S.fate);}
function spellMult(sp,enemyEl){if(!enemyEl)return 1;let m=elemMult(sp.e1,enemyEl);if(sp.e2)m=Math.max(m,elemMult(sp.e2,enemyEl));return m;}
function checkSources(){
 Object.keys(SRC).forEach(k=>{if(!S.sources.includes(k)&&SRC[k].req()){S.sources.push(k);L(`New source of power unlocked: ${SRC[k].n}.`,'gold');chron(`Unlocked ${SRC[k].n} magic.`);}});
}
function forgeState(){
 const srcs=S.sources;
 const e1s=ELS.filter(e=>S.aff[e]>=10);
 if(!srcs.includes(ui.fs))ui.fs=srcs[0]||'';
 if(!e1s.includes(ui.fe1))ui.fe1=e1s[0]||'';
 const e2s=ELS.filter(e=>e!==ui.fe1&&S.aff[e]>=30&&S.aff[ui.fe1]>=30);
 if(ui.fe2&&!e2s.includes(ui.fe2))ui.fe2='';
 if(!FORMS[ui.ff])ui.ff='bolt';
 return{srcs,e1s,e2s};
}

/* ============ COMBAT ============ */
function hunt(bi){
 const reg=REG[S.region];const b=(bi!=null&&reg.beasts[bi])?reg.beasts[bi]:pick(reg.beasts);const sc=1+0.5*(S.tier-1);
 let ehp=Math.round(b.hp*sc);const eatk=b.atk*sc;
 const usable=S.spells.filter(spellUsable);
 const has=f=>usable.some(s=>s.form===f);
 const silent=S.spells.some(s=>s.src==='faith')&&!S.spells.filter(s=>s.src==='faith').some(spellUsable);
 const ward=has('ward'),weave=has('weave'),shape=has('shape'),enchant=has('enchant'),summon=has('summon');
 const phys=(4+S.stats.str*0.5+S.stats.agi*0.3)*(shape?1.3:1)*(enchant?1.2:1);
 const dmgSp=usable.filter(s=>DMG_FORMS.includes(s.form));
 const used={};let rounds=0;const startHp=S.hp;let best_m=1;
 while(ehp>0&&rounds<6&&S.hp>10){
  rounds++;
  let bestD=phys,bestSp=null;
  dmgSp.forEach(sp=>{const m=spellMult(sp,b.el);const exp=spellPower(sp)*m*FORMS[sp.form].dmg*(sp.form==='ritual'?0.5:1);if(exp>bestD){bestD=exp;bestSp=sp;}});
  let dealt;
  if(bestSp){
   const m=spellMult(bestSp,b.el);best_m=m;
   dealt=bestSp.form==='ritual'?(Math.random()<0.5?0:spellPower(bestSp)*m*1.6):spellPower(bestSp)*m*FORMS[bestSp.form].dmg*rnd(0.85,1.15);
   if(bestSp.src==='life')hurt(3);
   if(bestSp.src==='contract')addCorr(1);
   used[bestSp.name]=(used[bestSp.name]||0)+1;
  }else{dealt=phys*rnd(0.85,1.15);used['your weapon']=(used['your weapon']||0)+1;}
  if(S.comp){const ch=RACES[S.comp.race].home;dealt+=(5+S.tier*3+S.comp.bond*0.05)*(ch?elemMult(ch,b.el):1)*rnd(0.85,1.15);}
  ehp-=dealt;
  if(ehp<=0)break;
  const m2=b.el&&S.home?elemMult(b.el,S.home):1;
  const ed=Math.max(1,eatk*m2*(ward?0.6:1)*(summon?0.85:1)*rnd(0.8,1.2)-S.stats.end*0.2);
  hurt(ed);
 }
 const usedTxt=Object.entries(used).map(([n,c])=>`${esc(n)} ×${c}`).join(', ');
 const lost=Math.round(startHp-S.hp);
 const head=`Hunted a ${b.n}${b.el?` (${ELEM[b.el].name})`:''} using ${usedTxt}${S.comp?`, with ${S.comp.name} at your side`:''}.`;
 if(ehp<=0){
  const gold=Math.round(b.gold*sc*rnd(0.8,1.2));S.gold+=gold;S.bloodDay=S.day;
  if(S.comp)S.comp.bond=clamp(S.comp.bond+2,0,100);
  const g=gains([['str',1],['agi',1]]);
  const ag=[];dmgSp.filter(s=>used[s.name]).forEach(s=>{[s.e1,s.e2].filter(Boolean).forEach(e=>{const x=addAff(e,2,{quiet:true});if(x>0)ag.push(affText(e,x));});});
  let healed=0;if(weave)healed=heal(12);
  L(`${head} Victory${best_m>1.1?', super effective':''}. +${gold} gold, −${lost} HP${healed?`, then healed ${healed}`:''}. ${join(g,...ag)}.`,'good');
 }else if(S.hp<=10){L(`${head} You retreat, badly hurt. −${lost} HP.`,'dark');}
 else{L(`${head} It escapes after a long fight. −${lost} HP.`,'mutl');}
}


/* ============ ACTION COMBAT RULES (real-time; see design/gdd/action-combat.md) ============ */
/** Tunable numbers for third-person movement, real-time combat, focus and the camera. */
const ACT={runSpeed:7,jumpV:9,gravity:25,
 atkCd:.55,atkRange:2.7,atkArc:1.25,
 dodgeCd:1.2,dodgeDist:6.5,dodgeTime:.28,iframes:.4,
 mpBase:50,mpPerMnd:2,mpRegen:4,
 aggro:9,leash:24,windup:.7,enemyCd:1.9,enemyReach:2.3,boltSpeed:9,
 killCap:8,killGold:.4,killGain:.3,respawn:75,
 skill:{bolt:{mp:10,cd:1.2,range:18},wave:{mp:18,cd:4,r:4.5},summon:{mp:25,cd:12,dur:8,tick:1,share:.3,r:7},ritual:{mp:30,cd:8,delay:1.2,r:3.5}},
 camMin:4,camMax:14,pitchMin:.12,pitchMax:1.15};
/** Focus (MP) pool for casting in real time. */
function mpMax(){return Math.round(ACT.mpBase+S.stats.mnd*ACT.mpPerMnd);}
/** Passive spell forms the player knows and can use. */
function passives(){const u=S.spells.filter(spellUsable);const has=f=>u.some(s=>s.form===f);return{ward:has('ward'),weave:has('weave'),shape:has('shape'),enchant:has('enchant'),summon:has('summon')};}
/** Weapon damage per swing before the random ±15%. Same formula as a hunt round. */
function meleeBase(){const p=passives();return(4+S.stats.str*0.5+S.stats.agi*0.3)*(p.shape?1.3:1)*(p.enchant?1.2:1);}
/** Companion damage added to each swing (half of a hunt round). */
function compDamage(b){if(!S.comp)return 0;const ch=RACES[S.comp.race].home;return(5+S.tier*3+S.comp.bond*0.05)*(ch?elemMult(ch,b.el):1)*0.5;}
/** The four hotbar spells: the first four damage spells in the spellbook. */
function skillSlots(){return S.spells.filter(s=>DMG_FORMS.includes(s.form)).slice(0,4);}
/** Damage of one spell hit on an enemy of element el (before the random ±10%). */
function skillDamage(sp,el){return spellPower(sp)*spellMult(sp,el)*FORMS[sp.form].dmg;}
function enemyScale(){return 1+0.5*(S.tier-1);}
/** Real-time enemy HP and attack, scaled by the player's tier like a hunt. */
function enemyStats(b){const sc=enemyScale();return{hp:Math.round(b.hp*sc),atk:b.atk*sc};}
/** Damage one enemy strike deals to the player. */
function enemyHitDamage(b){const p=passives();const m2=b.el&&S.home?elemMult(b.el,S.home):1;return Math.max(1,Math.round(b.atk*enemyScale()*m2*(p.ward?0.6:1)*(p.summon?0.85:1)-S.stats.end*0.2));}
/** Rewards for a real-time kill. Costs no action; only the first ACT.killCap kills a day pay. Returns the log line. */
function killReward(b,els){
 if(!S.kills||S.kills.d!==S.day)S.kills={d:S.day,n:0};S.kills.n++;S.bloodDay=S.day;
 if(S.kills.n>ACT.killCap)return `${b.n} defeated. The wilds have given all they will today; come back after dawn.`;
 const gold=Math.max(1,Math.round(b.gold*enemyScale()*ACT.killGold));S.gold+=gold;
 if(S.comp)S.comp.bond=clamp(S.comp.bond+1,0,100);
 const g=gains([['str',ACT.killGain],['agi',ACT.killGain]]);
 const ag=[];(els||[]).filter((e,i,a)=>e&&a.indexOf(e)===i).forEach(e=>{const x=addAff(e,1,{quiet:true});if(x>0)ag.push(affText(e,x));});
 const healed=passives().weave?heal(4):0;
 return `${b.n} defeated. +${gold} gold${healed?`, healed ${healed}`:''}. ${join(g,...ag)}.`;
}

/* ---------- multiplayer data (untrusted input from other viewers) ---------- */
const PEER_ANIMS=['idle','run','jump','atk','cast','dodge'];
const FX_KINDS=['slash','bolt','wave','summon','ritual'];
const own=(o,k)=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k);
/** Strips control and invisible characters and cuts to n characters. */
function cleanText(s,n){return String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f]/g,' ').replace(/[\u00ad\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim().slice(0,n);}
function numIn(v,a,b){return typeof v==='number'&&isFinite(v)?clamp(v,a,b):null;}
/** What this player shares with everyone in the room (presence). */
function myPresence(p){return{n:cleanText(S.name,20),k:S.race,t:S.tier,ti:cleanText(title(),40),x:Math.round(p.x*10)/10,y:Math.round(p.y*10)/10,z:Math.round(p.z*10)/10,r:Math.round((p.ry||0)*100)/100,a:PEER_ANIMS.includes(p.anim)?p.anim:'idle',h:Math.round(Math.max(0,S.hp)),hm:hpMax(),g:S.region};}
/** Turns another viewer's presence into safe display data, or null if it has no position. */
function sanitizePeer(p){
 if(!p||typeof p!=='object')return null;const x=numIn(p.x,WB.minX,WB.maxX),z=numIn(p.z,WB.minZ,WB.maxZ);if(x===null||z===null)return null;
 const y=numIn(p.y,-30,80),r=numIn(p.r,-1000,1000),t=numIn(p.t,1,9),h=numIn(p.h,0,100000),hm=numIn(p.hm,1,100000);
 return{name:cleanText(p.n,20)||'Wanderer',race:own(RACES,p.k)?p.k:'humans',tier:Math.round(t===null?1:t),title:cleanText(p.ti,40),x,y:y===null?0:y,z,ry:r===null?0:r,anim:PEER_ANIMS.includes(p.a)?p.a:'idle',hp:h===null?0:h,hpMax:hm===null?1:hm,region:own(REG,p.g)?p.g:null};
}
/** Validates a cosmetic skill effect another viewer broadcast. */
function sanitizeFx(d){
 if(!d||typeof d!=='object'||!FX_KINDS.includes(d.s))return null;const x=numIn(d.x,WB.minX,WB.maxX),z=numIn(d.z,WB.minZ,WB.maxZ);if(x===null||z===null)return null;
 const tx=numIn(d.tx,WB.minX,WB.maxX),tz=numIn(d.tz,WB.minZ,WB.maxZ),y=numIn(d.y,-30,80),r=numIn(d.r,-1000,1000);
 return{s:d.s,x,z,y:y===null?0:y,r:r===null?0:r,e:own(ELEM,d.e)?d.e:null,tx:tx===null?x:tx,tz:tz===null?z:tz};
}

function doAction(kind,arg){
 if(!S)return;
 const def=actionDef(kind,arg);if(!def)return;

 if(def.gold){if(S.gold<def.gold)return toast(`You need ${def.gold} gold.`);S.gold-=def.gold;}
 OUT=[];SLOT=timeIdx();
 def.run(arg);
 if(cost>0){envEffects();S.used+=cost;}

function renderAct(){

 const others=Object.keys(REG).filter(k=>k!==S.region);
 if(!others.includes(ui.travel))ui.travel=others[0];
 const prac=practicable();
 if(!prac.includes(ui.prac))ui.prac=prac[0]||'';
 const warns=envWarnings();
 const btn=(act,arg,n,d,kind,cost,disabled)=>`<button class="act ${kind||''}" data-act="${act}"${arg!=null?` data-arg="${arg}"`:''}${(cost!==0&&out)||disabled?' disabled':''}><b>${n}</b><small>${d}</small></button>`;
 const npc=npcHere(),N=NPCS[npc],st=S.npcs[npc],att=attitude(st.rep);
 const npcLine={Hostile:'turns away the moment you appear.',Wary:'watches you carefully.',Neutral:'nods at you.',Friendly:'greets you warmly.',Devoted:'lights up when they see you.'}[att.n];
 return `
 <section>
  <div class="row" style="justify-content:space-between"><h2>${reg.name}</h2><div class="chips">${reg.els.length?reg.els.map(elChip).join(''):'<span class="el" style="--c:var(--mut)">Town</span>'}</div></div>
  <p>${reg.desc}</p>
  <p class="mut">Weather: ${w.name}${w.boost.length?` · boosts ${w.boost.map(e=>ELEM[e].name).join(', ')}`:''}${w.pen.length?` · weakens ${w.pen.map(e=>ELEM[e].name).join(', ')}`:''} · reputation here: ${attitude(S.regRep[S.region]).n} (${fl(S.regRep[S.region])})</p>
  <p class="mut">Materials: ${S.mat.wood} wood \u00b7 ${S.mat.stone} stone. ${HAS3D?'Build on your plot in Thorngate with the hammer button.':''}</p>
  ${warns.map(x=>`<p class="warn">${x.t}: −${x.n} HP per action${x.cond?`, may leave you ${COND[x.cond].n.toLowerCase()}`:''}.${x.fix?` <span class="mut">Resist with: ${x.fix}.</span>`:''}</p>`).join('')}
  ${HAS3D?'<p class="mut">Walk the world to travel. Each place has its own people, dangers and creatures.</p>':`<div class="row"><label for="travel" class="kicker">Travel to</label><select id="travel" data-bind="travel">${others.map(k=>opt(k,`${REG[k].name}${REG[k].els.length?' · '+REG[k].els.map(e=>ELEM[e].name).join('/'):''}`,ui.travel)).join('')}</select><button class="btn" data-act="travel"${out?' disabled':''}>Travel · 1 action</button></div>`}
 </section>
 <section>
  <h3>Actions</h3>
  ${out?'<p class="warn">No actions left today. Sleep to wake at dawn.</p>':''}
  <div class="acts">
   ${Object.entries(ACTS).filter(([k])=>k!=='work'||S.job).map(([k,a])=>btn(k,null,a.n,a.d)).join('')}
   ${reg.sp.map(k=>btn('sp',k,SP[k].n,SP[k].d,SP[k].kind,SP[k].cost)).join('')}
  </div>
  <div class="row"><label for="prac" class="kicker">Practice element</label>
   ${prac.length?`<select id="prac" data-bind="prac">${prac.map(e=>opt(e,`${ELEM[e].name} (${fl(S.aff[e])})`,ui.prac)).join('')}</select><button class="btn" data-act="practice"${out?' disabled':''}>Practice · 1 action</button>`:'<span class="mut">No element you can practice here right now.</span>'}
  </div>
  ${S.region==='vael'?`<div class="row"><label for="job" class="kicker">Guild</label><select id="job" data-bind="job">${Object.keys(JOBS).map(k=>opt(k,`${JOBS[k].n} · ${SN[JOBS[k].s]}${JOBS[k].el?' · '+ELEM[JOBS[k].el].name:''}`,ui.job||S.job||'blacksmith')).join('')}</select><button class="btn" data-act="job">${S.job?'Change job':'Take up job'}</button></div>${S.job?'<p class="mut" style="font-size:.88rem">Changing job resets job experience.</p>':''}`:''}
 </section>
 <section>
  <h3>Food</h3>
  ${dietOf(S.race)==='none'?`<p class="mut">A ${R().sing} needs no food.</p>`:(()=>{
   const fh=foodsHere();const okT=DIETS[dietOf(S.race)].ok;
   if(!fh.some(([k])=>k===ui.food))ui.food=(fh.find(([k,f])=>okT.includes(f.type))||fh[0]||[''])[0];
   return `<p class="mut">${DIETS[dietOf(S.race)].n}. ${S.fedDay===S.day?'You have eaten today.':'You have not eaten today. Go to sleep hungry and you wake weaker.'}</p>
   ${fh.length?`<div class="row"><select id="food" data-bind="food">${fh.map(([k,f])=>opt(k,`${f.n}${f.gold?` · ${f.gold} gold`:''} · ${okT.includes(f.type)?'suits you':'makes you sick'}`,ui.food)).join('')}</select><button class="btn" data-act="eat">Eat · no time</button></div>`:'<p class="mut">Nothing you can eat here right now.</p>'}`;})()}
 </section>
 ${S.comp||S.cand?`<section>
  <h3>Companion</h3>
  ${S.comp?`<div class="npc"><div class="npc-h"><b>${esc(S.comp.name)} the ${RACES[S.comp.race].sing}</b><span class="att" style="color:${S.comp.bond>=50?'var(--fate)':S.comp.bond>=25?'var(--mut)':'var(--hp)'}">Bond ${fl(S.comp.bond)}</span></div>
   <p class="mut">Compatibility ${S.comp.compat}. ${S.comp.compat>=60?'You get along well; bond grows each dawn.':S.comp.compat>=40?'You tolerate each other; bond grows slowly.':'You clash; bond falls each dawn.'} Places that hurt their kind lower bond. At 0 they leave.</p>
   ${hazards(S.comp.race,false).length?`<p class="warn">${esc(S.comp.name)} suffers here: ${hazards(S.comp.race,false).map(x=>x.t.toLowerCase()).join(', ')}.</p>`:''}
   <div class="row"><button class="btn" data-act="dismiss">Part ways</button></div></div>`:''}
  ${S.cand?`<div class="npc"><div class="npc-h"><b>${esc(S.cand.name)}, a ${RACES[S.cand.race].sing}</b><span class="att" style="color:${S.cand.compat>=60?'var(--fate)':S.cand.compat>=35?'var(--mut)':'var(--corr)'}">Compatibility ${S.cand.compat}</span></div>
   <p class="mut">${S.cand.why.map(esc).join(' · ')}. ${S.cand.compat<35?'They will not travel with you.':''}</p>
   <div class="row"><button class="btn primary" data-act="invite"${S.cand.compat<35?' disabled':''}>Invite${S.comp?' (replaces '+esc(S.comp.name)+')':''}</button><button class="btn" data-act="decline">Part ways</button></div></div>`:''}
 </section>`:''}
 <section>
  <div class="npc">
   <div class="npc-h"><h3 style="color:var(--fg)">${N.name}, ${N.role}</h3><span class="att" style="color:${att.c}">${att.n} ${fl(st.rep)}</span></div>
   <p>${N.name} ${npcLine}</p>
   <p class="mut">Today: ${needOf(npc)}.</p>
   <div class="acts">
    ${btn('help',npc,'Help',st.helped===S.day?'Already helped today':'Fate +5, reputation +10','kind',1,st.helped===S.day)}
    ${btn('trade',npc,'Trade','Gold and Charm',null,1)}
    ${btn('steal',npc,'Steal',`Gold, Corruption +6. ${Math.round(Math.min(0.9,0.35+S.stats.agi*0.012)*100)}% unseen`,'dark',1)}
   </div>
   ${st.mem.length?`<p class="mut" style="font-size:.88rem">Remembers: ${st.mem.slice(-2).map(esc).join(' · ')}</p>`:''}
  </div>
 </section>
 <section>
  <button class="btn primary sleep" data-act="sleep">Sleep until dawn</button>
  <h3>Recent</h3>
  ${logList(S.log.slice(-12).reverse())}
 </section>`;
}

function renderSelf(){
 const r=R();const smax=Math.max(40,...STATS.map(k=>S.stats[k]));
 const lean=S.tier===1?bestPath():S.path;
 const nodes=r.paths.map((p,i)=>{
  const cls=S.tier>=2?(i===S.path?'cur':'dim'):(i===lean?'lean':'');
  return `<span class="node ${cls}">${p.n} <span class="mut">${SN[p.s]}</span></span>`;}).join('');
 const t3=r.paths.map((p,i)=>`<span class="node ${S.tier>=3&&i===S.path?'cur':S.tier>=2&&i!==S.path?'dim':''}">${p.t3}</span>`).join('');
 const legendLight=S.race==='humans'&&S.blood?BLOOD[S.blood].legend:r.legend;
 const reqs=S.tier<4?evoReqs(S.tier+1):[];
 return `
 <section>
  <h3>Evolution</h3>
  <div class="tree">
   <div class="tier"><span class="kicker">Tier 1</span><div><span class="node ${S.tier===1?'cur':''}">Newly Born ${r.sing}</span></div></div>
   <div class="tier"><span class="kicker">Tier 2</span><div>${nodes}</div></div>
   <div class="tier"><span class="kicker">Tier 3</span><div>${t3}</div></div>
   <div class="tier"><span class="kicker">Tier 4</span><div><span class="node ${S.tier===4&&S.legendName===legendLight?'cur':S.tier<4&&S.fate>=S.corr?'lean':''}">${legendLight}</span><span class="node ${S.tier===4&&S.legendName===r.dark?'cur':S.tier<4&&S.corr>S.fate?'lean':''}" style="border-color:color-mix(in srgb,var(--corr) 60%,var(--line))">${r.dark}</span></div></div>
  </div>
  ${S.tier===1?`<p class="mut">Leaning toward <b style="color:var(--gold)">${r.paths[lean].n}</b>, your highest matching stat is ${SN[r.paths[lean].s]}. Your path is fixed when you reach Tier 2.</p>`:''}
  ${S.tier<4?`<div><div class="kicker" style="margin-bottom:6px">Next dawn evolution to Tier ${S.tier+1} needs</div><ul class="req">${reqs.map(x=>`<li class="${x.ok?'ok':''}">${x.l}</li>`).join('')}</ul>${S.tier===3?`<p class="mut" style="margin-top:6px">Whichever is higher, Fate or Corruption, decides your legendary form.</p>`:''}</div>`:'<p class="mut">You have reached your legendary form.</p>'}
 </section>
 <div class="two">
  <section>
   <h3>Stats</h3>
   ${STATS.map(k=>`<div class="stat"><span>${SN[k]}</span>${bar(S.stats[k],smax,'var(--gold)')}<span class="num" style="text-align:right">${fl(S.stats[k])}</span></div>`).join('')}
   <p class="mut" style="font-size:.88rem">Total ${fl(statSum())}. Endurance 25 grants a 4th daily action.${R().group==='night'?' Night kind: gains +30% at night, −20% in sunlight.':''}${S.pet?` Companion: ${S.pet} (+10% gains).`:''}</p>
  </section>
  <section>
   <h3>Elements</h3>
   <p class="mut" style="font-size:.88rem">Holding ${slotsUsed()} of ${maxSlots()} elements. ${S.race==='humans'?'Humans grow elements 50% faster and change body at Flow.':'Body changes at Bond.'}</p>
   ${ELS.map(e=>{const v=S.aff[e],lv=affLevel(v),locked=v<=0&&!canGrow(e);return `<div class="aff" style="${locked?'opacity:.4':''}"><span style="color:${ELEM[e].c}">${ELEM[e].name}</span>${bar(v,100,ELEM[e].c)}<span class="lvl">${locked?'Locked':`${lv.n} ${fl(v)}`}</span></div>`;}).join('')}
  </section>
 </div>
 <section>
  <h3>Body and needs</h3>
  <p>${DIETS[dietOf(S.race)].n} · ${bodyNotes(S.race).join(' · ')}</p>
  <p class="mut" style="font-size:.9rem">Elements protect you too: Water 30 lets you breathe underwater, Fire or Magma 30 lets you walk on lava, Ice 30 resists cold, Air 30 handles thin air, Death or Spirit 10 resists grave miasma.</p>
  ${Object.keys(S.cond).length?`<ul class="req">${Object.keys(S.cond).filter(c=>COND[c]).map(c=>`<li class="${COND[c].good?'ok':''}"><b>${COND[c].n}</b> · ${COND[c].d}</li>`).join('')}</ul>`:''}
  <p>${S.traits.length?S.traits.map(esc).join(' · '):'<span class="mut">No changes yet. Elements at Bond reshape your body.</span>'}</p>
  <p class="mut">${esc(r.trait)}.${S.blood?` Awakened ${BLOOD[S.blood].name} blood.`:''}${S.home?` Home element: ${ELEM[S.home].name}.`:' No home element yet; your strongest element becomes it at Tier 2.'}</p>
 </section>`;
}

function renderMagic(){
 const fs=forgeState();const out=energyLeft()<=0;
 const preview=ui.fe1?autoName(ui.fe1,ui.fe2||null,ui.ff):'';
 const k=ui.fs&&ui.fe1?codexKey({src:ui.fs,e1:ui.fe1,e2:ui.fe2||null,form:ui.ff}):'';
 const known=k&&CODEX[k];
 return `
 <section>
  <h3>Sources of power</h3>
  <p class="mut">Spell = Source + Element + Form. Power grows with the source’s stat and your element affinity.</p>
  <div class="srcs">${Object.entries(SRC).map(([id,s])=>{const on=S.sources.includes(id);return `<div class="src${on?' on':''}"><b>${s.n} ${on?'<span class="kicker" style="color:var(--gold)">unlocked</span>':''}</b><span class="mut">${s.d}</span><span class="kicker">${on?`Uses ${SN[s.stat]}`:`Needs ${s.rt}`}</span></div>`;}).join('')}</div>
 </section>
 <section>
  <h3>Spell forge</h3>
  ${fs.e1s.length?`
  <div class="forge">
   <label for="fs">Source<select id="fs" data-bind="fs">${fs.srcs.map(s=>opt(s,SRC[s].n,ui.fs)).join('')}</select></label>
   <label for="fe1">Element<select id="fe1" data-bind="fe1">${fs.e1s.map(e=>opt(e,`${ELEM[e].name} (${fl(S.aff[e])})`,ui.fe1)).join('')}</select></label>
   <label for="fe2">Fuse with<select id="fe2" data-bind="fe2">${opt('','None',ui.fe2)}${fs.e2s.map(e=>opt(e,ELEM[e].name,ui.fe2)).join('')}</select></label>
   <label for="ff">Form<select id="ff" data-bind="ff">${Object.keys(FORMS).map(f=>opt(f,FORMS[f].n,ui.ff)).join('')}</select></label>
  </div>
  <p class="mut">${FORMS[ui.ff].d}${fs.e2s.length?'':' Fusion unlocks when two elements reach Flow (30).'}</p>
  ${known?`<p>This spell already exists: <b>${esc(known.name)}</b>, created by ${esc(known.inventor)}. You will learn it under that name.</p>`:`<div class="row"><label for="fname" class="kicker">Name it</label><input type="text" id="fname" data-bind="fname" maxlength="28" placeholder="${esc(preview)}" value="${esc(ui.fname)}" style="flex:1 1 200px"></div><p class="mut">No one has made this combination yet. You will be its creator.</p>`}
  <div class="row"><button class="btn primary" data-act="forge"${out?' disabled':''}>Forge spell · 1 action</button><span class="mut">${S.spells.length}/6 spells</span></div>
  `:'<p class="mut">You need an element at Spark (10) to shape a spell. Practice an element first.</p>'}
 </section>
 <section>
  <h3>Spellbook</h3>
  ${S.spells.length?S.spells.map((sp,i)=>`<div class="spell"><div style="display:grid;gap:4px;min-width:0"><span class="spell-name">${esc(sp.name)}${sp.mine?' <span class="kicker" style="color:var(--gold)">your creation</span>':''}</span><div class="chips">${elChip(sp.e1)}${sp.e2?elChip(sp.e2):''}<span class="kicker">${SRC[sp.src].n} · ${FORMS[sp.form].n}</span></div></div><div class="row"><span class="num">${spellUsable(sp)?`Power ${fl(spellPower(sp))}`:'Silent'}</span><button class="btn" data-act="forget" data-arg="${i}">Forget</button></div></div>`).join(''):'<p class="mut">Empty. Spells are used automatically in hunts: the best damage spell for the enemy’s element each round, plus any Ward, Weave, Shape or Enchant you know.</p>'}
 </section>
 <section>
  <h3>Spell codex of this world</h3>
  <p class="mut" style="font-size:.88rem">Every first creation is recorded with its inventor. In this prototype the world lives in your browser, shared by every character you make here.</p>
  ${Object.keys(CODEX).length?`<div class="tbl-wrap"><table><thead><tr><th>Spell</th><th>Recipe</th><th>Creator</th></tr></thead><tbody>${Object.entries(CODEX).map(([key,c])=>{const[src,els,form]=key.split('|');return `<tr><td>${esc(c.name)}</td><td>${SRC[src]?SRC[src].n:esc(src)} · ${els.split('+').map(e=>ELEM[e]?ELEM[e].name:esc(e)).join(' + ')} · ${FORMS[form]?FORMS[form].n:esc(form)}</td><td>${esc(c.inventor)}, day ${c.day}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="mut">No spells recorded yet.</p>'}
 </section>`;
}

function renderWorld(){
 return `
 <section>
  <h3>Regions</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Place</th><th>Elements</th><th>Weather today</th><th>Reputation</th></tr></thead><tbody>
  ${Object.entries(REG).map(([k,r])=>{const a=attitude(S.regRep[k]);return `<tr><td>${r.name}${k===S.region?' <span class="kicker" style="color:var(--gold)">here</span>':''}</td><td><div class="chips">${r.els.map(elChip).join('')||'<span class="mut">Town</span>'}</div></td><td>${WEATHER[weatherHere(k)].name}</td><td style="color:${a.c}">${a.n} ${fl(S.regRep[k])}</td></tr>`;}).join('')}
  </tbody></table></div>
 </section>
 <section>
  <h3>People who know you</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Lives in</th><th>Attitude</th><th>Remembers</th></tr></thead><tbody>
  ${Object.entries(NPCS).map(([k,n])=>{const s=S.npcs[k],a=attitude(s.rep);return `<tr><td>${n.name}<div class="mut" style="font-size:.82rem">${n.role}</div></td><td>${REG[NPC_REGION[k]].name}</td><td style="color:${a.c}">${a.n} ${fl(s.rep)}${s.gifted?' · ally':''}</td><td class="mut">${s.mem.length?s.mem.slice(-3).map(esc).join('<br>'):'Nothing yet'}</td></tr>`;}).join('')}
  </tbody></table></div>
  <p class="mut" style="font-size:.88rem">Reputation 60 with a person makes them a devoted ally who teaches you a secret. Hostile places pay half for work and people there refuse to trade.</p>
 </section>
 <section>
  <h3>Element wheel</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Element</th><th>Strong against</th><th>Weak against</th></tr></thead><tbody>
  ${ELS.map(e=>`<tr><td>${elChip(e)}</td><td>${ELEM[e].strong.map(x=>ELEM[x].name).join(', ')}</td><td>${ELEM[e].weak.map(x=>ELEM[x].name).join(', ')}</td></tr>`).join('')}
  </tbody></table></div>
 </section>`;
}

function renderLog(){
 return `
 <section>
  <h3>Chronicle</h3>
  <p class="mut" style="font-size:.88rem">The great moments of your life.</p>
  <ul class="log">${S.chron.slice().reverse().map(c=>`<li class="gold"><span class="kicker">Day ${c.d}</span> ${esc(c.t)}</li>`).join('')}</ul>

/* ---------- terrain math ---------- */
function hashN(i,j){let h=Math.imul(i,374761393)+Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j;const u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);const a=hashN(i,j),b=hashN(i+1,j),c=hashN(i,j+1),d=hashN(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){return vnoise(x*.08,z*.08)*.65+vnoise(x*.21+40,z*.21+40)*.35;}
function segDist(px,pz,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];const t=clamp(((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz),0,1);const x=a[0]+t*dx-px,z=a[1]+t*dz-pz;return Math.sqrt(x*x+z*z);}
function riverDist(x,z){let m=1e9;for(let i=0;i<RIVER.length-1;i++)m=Math.min(m,segDist(x,z,RIVER[i],RIVER[i+1]));return m;}
function regionAt(x,z){let best='vael',bd=1e9;for(const k in CENTERS){const dx=x-CENTERS[k][0],dz=z-CENTERS[k][1],d=dx*dx+dz*dz;if(d<bd){bd=d;best=k;}}return best;}
function biomeMix(x,z){let ws=0,h=0,amp=0;const w={};for(const k in CENTERS){const dx=x-CENTERS[k][0],dz=z-CENTERS[k][1];const v=Math.exp(-(dx*dx+dz*dz)/(2*22*22))+1e-9;w[k]=v;ws+=v;h+=v*BIOME[k].h;amp+=v*BIOME[k].amp;}return{w,ws,h:h/ws,amp:amp/ws};}

/* ---------- the plot (build area) ---------- */
const PLOT={x0:4,z0:28,cols:14,rows:10,t:2,land:.6,deck:.8};
const POND={x:23,z:38,rx:8.5,rz:7};
function inPond(x,z){const a=(x-POND.x)/POND.rx,b=(z-POND.z)/POND.rz;return a*a+b*b<1;}
function plotW(x,z){const x1=PLOT.x0+PLOT.cols*PLOT.t,z1=PLOT.z0+PLOT.rows*PLOT.t;const dx=Math.max(PLOT.x0-x,0,x-x1),dz=Math.max(PLOT.z0-z,0,z-z1);const d=Math.hypot(dx,dz);return d<=0?1:Math.max(0,1-d/5);}
function tileCenter(c,r){return[PLOT.x0+(c+.5)*PLOT.t,PLOT.z0+(r+.5)*PLOT.t];}
function tileAt(x,z){const c=Math.floor((x-PLOT.x0)/PLOT.t),r=Math.floor((z-PLOT.z0)/PLOT.t);return(c>=0&&r>=0&&c<PLOT.cols&&r<PLOT.rows)?{c,r}:null;}
function tileWater(c,r){const p=tileCenter(c,r);return inPond(p[0],p[1]);}

/** Climbable rock crags: steep painted cliffs with flat tops. [x, z, height, top radius, foot radius] */
const CRAGS=[[10,18,7,3.5,7.5],[-16,8,6,3,6.5],[25,-21,6,3,6.5],[-18,-62,9,4,8],[9,-63,8,3.5,7],[-63,-30,8,3.5,7.5],[67,-29,7,3.5,7],[33,-67,8,3.5,7.5],[56,84,6,3,6.5]];
function cragAt(x,z){let best=0;for(const c of CRAGS){const dx=x-c[0],dz=z-c[1];if(dx>c[4]+2||dx<-c[4]-2||dz>c[4]+2||dz<-c[4]-2)continue;const d=Math.hypot(dx,dz)*(1+(fbm(x*.9,z*.9)-.5)*.35);const k=1-clamp((d-c[3])/(c[4]-c[3]),0,1);const v=c[2]*k*k*(3-2*k);if(v>best)best=v;}return best;}
function heightAt(x,z){
 const m=biomeMix(x,z);let h=m.h+(fbm(x,z)-.5)*2*m.amp;
 const rd=riverDist(x,z);if(rd<7)h-=3.4*Math.exp(-(rd*rd)/9);
 const cw=cragAt(x,z);if(cw)h=Math.max(h,h+cw);
 if(Math.abs(x)<3&&z>24&&z<74)h=h*.4+.6*(1+(fbm(x,z)-.5)*.3);
 const pw=plotW(x,z);if(pw>0){const ph=inPond(x,z)?-1.1:PLOT.land;h=h*(1-pw)+ph*pw;}
 const e=Math.min(x-WB.minX,WB.maxX-x,z-WB.minZ,WB.maxZ-z);if(e<12)h+=Math.pow((12-e)/12,2)*18;
 return h;
}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
const BIOME_RGB={};for(const k in BIOME)BIOME_RGB[k]=hexRgb(BIOME[k].c);
function colorAt(x,z,h){
 const m=biomeMix(x,z);let r=0,g=0,b=0;for(const k in m.w){const c=BIOME_RGB[k];r+=c[0]*m.w[k];g+=c[1]*m.w[k];b+=c[2]*m.w[k];}r/=m.ws;g/=m.ws;b/=m.ws;
 const mix=(c,t)=>{r+=(c[0]-r)*t;g+=(c[1]-g)*t;b+=(c[2]-b)*t;};
 if(h>10)mix([.93,.95,.97],clamp((h-10)/3,0,1));
 if(h<-.2)mix([.16,.22,.24],clamp(-h/1.5,0,.8));
 if(riverDist(x,z)<5&&h<.6&&h>-.2)mix([.62,.56,.42],.5);
 if(Math.abs(x)<2.2&&z>24&&z<74)mix([.52,.45,.33],.8);
 const j=(hashN(Math.floor(x*3),Math.floor(z*3))-.5)*.06;return[clamp(r+j,0,1),clamp(g+j,0,1),clamp(b+j,0,1)];
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function itemSize(it){const C=CATALOG[it.t];const s=C.size||[1,1];return it.rot%2?[s[1],s[0]]:[s[0],s[1]];}
function footprint(it){const[w,d]=itemSize(it);const out=[];for(let i=0;i<w;i++)for(let j=0;j<d;j++)out.push([it.c+i,it.r+j]);return out;}
function occMap(){const m={};S.build.forEach(it=>{const L=CATALOG[it.t].layer;footprint(it).forEach(([c,r])=>{m[c+','+r+L]=it;});});return m;}
function canPlace(t,c,r,rot){
 const C=CATALOG[t];if(!C)return'Unknown item.';const o=occMap();
 for(const[cc,rr] of footprint({t,c,r,rot})){
  if(cc<0||rr<0||cc>=PLOT.cols||rr>=PLOT.rows)return'That does not fit on your plot.';
  if(o[cc+','+rr+C.layer])return'Something is already there.';
  const wet=tileWater(cc,rr);
  if(C.where==='water'){if(!wet)return'This goes on open water.';if(o[cc+','+rr+'floor'])return'This goes on open water, not on a deck.';}
  else if(C.where==='land'){if(wet)return'This needs dry land.';}
  else if(C.layer==='obj'&&wet&&!o[cc+','+rr+'floor'])return'Build a boardwalk over the water first.';
  if(C.layer==='floor'&&o[cc+','+rr+'obj']&&CATALOG[o[cc+','+rr+'obj'].t].where==='water')return'Clear the water first.';

function costText(cost){return Object.entries(cost).map(([k,v])=>`${v} ${k}`).join(' · ');}
function canAfford(cost){return(S.gold>=(cost.gold||0))&&(S.mat.wood>=(cost.wood||0))&&(S.mat.stone>=(cost.stone||0));}
function pay(cost,sign){S.gold-=(cost.gold||0)*sign;S.mat.wood-=(cost.wood||0)*sign;S.mat.stone-=(cost.stone||0)*sign;}
const AMB_DECAY=.8,COST_GROWTH=1.1;
/** Ambience: each extra copy of the same item counts AMB_DECAY times the previous copy. */
function ambience(){const n={};let a=0;S.build.forEach(it=>{const C=CATALOG[it.t];if(!C)return;const k=n[it.t]=(n[it.t]||0)+1;a+=C.amb*Math.pow(AMB_DECAY,k-1);});return Math.round(a);}
/** Cost of the next copy of an item: decorations grow by COST_GROWTH per copy already placed; floors never grow. */
function itemCost(t){const C=CATALOG[t];if(C.layer==='floor')return C.cost;const k=S.build.filter(i=>i.t===t).length;const f=Math.pow(COST_GROWTH,k);const o={};for(const r in C.cost)o[r]=Math.ceil(C.cost[r]*f);return o;}
function sellers(){return S.build.filter(it=>CATALOG[it.t]&&CATALOG[it.t].sells);}
function applyStarter(){STARTER.forEach(([t,c,r])=>{if(!canPlace(t,c,r,0))S.build.push({t,c,r,rot:0,id:'s'+c+'_'+r+t});});S.flags.starter=true;}
function buildPlace(t,c,r,rot){
 const C=CATALOG[t];const err=canPlace(t,c,r,rot);if(err)return err;
 const cost=itemCost(t);if(!canAfford(cost))return`You need ${costText(cost)}.`;
 pay(cost,1);const it={t,c,r,rot,id:Date.now().toString(36)+Math.floor(Math.random()*1e4)};S.build.push(it);
 if(W3)addItemMesh(it);save();return null;
}
function buildRemove(c,r){
 const o=occMap();const it=o[c+','+r+'obj']||o[c+','+r+'floor'];if(!it)return'Nothing to remove there.';
 if(CATALOG[it.t].layer==='floor'&&footprint(it).some(([cc,rr])=>o[cc+','+rr+'obj']))return'Remove what stands on the deck first.';
 S.build.splice(S.build.indexOf(it),1);const C=CATALOG[it.t];pay({gold:Math.floor((C.cost.gold||0)/2),wood:Math.floor((C.cost.wood||0)/2),stone:Math.floor((C.cost.stone||0)/2)},-1);
 if(W3)removeItemMesh(it);save();return null;
}

/* ---------- night market ---------- */
function salesCap(){return Math.min(24,sellers().reduce((a,it)=>a+(it.t==='teahouse'?5:3),0)+Math.floor(ambience()/10));}
function salePrice(it){const a=ambience();return Math.max(1,Math.round(CATALOG[it.t].sells*(1+a/300)*(1+Math.max(0,S.regRep.vael)/200)*(1+S.stats.cha/200)));}
function marketCheck(){
 if(S.region!=='vael')return'The night market is held in Thorngate.';
 if(!sellers().length)return'Build a market stall or tea house on your plot first.';
 if(S.marketDay===S.day)return'You already held the market today. Open it again tomorrow.';
 return null;
}
function openMarket(){
 S.marketDay=S.day;S.salesToday=0;S.salesCap=salesCap();
 if(!HAS3D||!W3){
  let g=0;const sl=sellers();for(let i=0;i<S.salesCap;i++)g+=salePrice(sl[i%sl.length]);S.gold+=g;S.salesToday=S.salesCap;addReg('vael',Math.min(8,S.salesCap*.3));
  L(`You hold the night market. ${S.salesCap} travelers buy from you. +${g} gold.`,'gold');
 }else{ui.market={sold:0,gold:0};ui.journal=false;ui.build=false;L(`You open the night market. Up to ${S.salesCap} travelers may come tonight.`,'gold');}
}
function closeMarket(reason,inner){
 if(!ui.market)return;const m=ui.market;ui.market=null;if(W3)despawnCustomers();
 if(!inner)OUT=[];
 L(`The market closes${reason?` (${reason})`:''}. ${m.sold} sales, +${m.gold} gold.`,'gold');
 if(m.sold>=10&&!S.flags.bigMarket){S.flags.bigMarket=true;chron(`Held a night market with ${m.sold} sales.`);}
 if(!inner){flush();save();render();}
}
function dawnHook(){
 if(ui.market)closeMarket('the night ended',true);
 const a=ambience();
 if(a>=100){addFate(1);L(`Your lantern plot glows through the night. Ambience ${a}: Fate +1.`,'good');}
 if(a>=150)addReg('vael',2);
}

function canAct(){return!!(W3&&ui.screen==='game'&&S&&S.hp>0&&!(ui.dialog||ui.journal||ui.fadeText||ui.build||ui.photo||NET.open));}
function nearestMonster(r){const p=W3.player;let best=null,bd=r*r;W3.monsters.forEach(m=>{if(!m.alive)return;const d=(m.x-p.x)**2+(m.z-p.z)**2;if(d<bd){bd=d;best=m;}});return best;}
function pickTarget(r){const w=W3,p=w.player,t=w.target;if(t&&t.alive&&Math.hypot(t.x-p.x,t.z-p.z)<=r)return t;const n=nearestMonster(r);if(n)w.target=n;return n;}

 p.cd.dodge=t+ACT.dodgeCd;let dx=p.inX,dz=p.inZ;if(!dx&&!dz){const ry=p.ch.g.rotation.y;dx=Math.sin(ry);dz=Math.cos(ry);}
 p.dodgeX=dx;p.dodgeZ=dz;p.dodgeT=ACT.dodgeTime;p.iUntil=t+ACT.iframes;p.tx=null;p.climb=false;p.ch.g.rotation.y=Math.atan2(dx,dz);

 const base=meleeBase();

function updateProjs(dt){

function hitMonster(m,dmg,mult,els){

 floatText(m.x,m.mo.g.position.y+2.2,m.z,String(dmg)+(mult>1.1?'!':''),mult>1.1?'#ffe066':mult<.9?'#b8b8c0':'#ffffff',mult>1.1);

function updateMonster(m,dt,t,blocked){
 const w=W3,p=w.player,mo=m.mo;
 if(!m.alive){if(t>m.deadT)reviveMonster(m);return;}
 const dxp=p.x-m.x,dzp=p.z-m.z,dp=Math.hypot(dxp,dzp)||.001,homeD=Math.hypot(m.x-m.hx,m.z-m.hz);
 const peace=blocked||w.grace>t||S.hp<=0;let vx=0,vz=0;m.cd-=dt;
 if(peace&&(m.st==='chase'||m.st==='windup'||m.st==='recover')){m.st='home';if(m.tele)m.tele.material.opacity=0;}
 if(m.st==='windup'){m.stT-=dt;turnTo(mo,dxp,dzp,dt);const tl=teleOf(m),k=1-Math.max(0,m.stT)/m.wind,r=mo.type==='wisp'?1:ACT.enemyReach+(mo.type==='golem'?.8:0);tl.scale.setScalar(r*(.35+.65*k));tl.material.opacity=.18+.32*k;tl.position.set(m.x,heightAt(m.x,m.z)+.08,m.z);if(m.stT<=0){monsterStrike(m);m.st='recover';m.stT=.55;}}
 else if(m.st==='recover'){m.stT-=dt;if(m.stT<=0)m.st='chase';}
 else if(m.st==='chase'||(!peace&&dp<ACT.aggro)){
  m.st='chase';
  if(homeD>ACT.leash||(dp>ACT.aggro*2.2&&!m.hit))m.st='home';
  else{const reach=mo.type==='wisp'?7:ACT.enemyReach*.75;if(dp>reach){const sp=mo.type==='golem'?3.2:mo.type==='wisp'?3.6:4.6;vx=dxp/dp*sp;vz=dzp/dp*sp;}else{turnTo(mo,dxp,dzp,dt);if(m.cd<=0){m.st='windup';m.wind=m.stT=ACT.windup*(mo.type==='golem'?1.35:1);m.cd=ACT.enemyCd;}}}
 }
 else if(m.st==='home'){const dx=m.hx-m.x,dz=m.hz-m.z,d=Math.hypot(dx,dz);if(d<1){m.st='wander';m.hit=false;m.hp=m.hpMax;m.els=[];}else{vx=dx/d*5.5;vz=dz/d*5.5;}}
 else{const dx=m.tx-m.x,dz=m.tz-m.z,d=Math.hypot(dx,dz);if(d<.5||Math.random()<dt*.15){m.tx=m.hx+(Math.random()-.5)*16;m.tz=m.hz+(Math.random()-.5)*16;if(regionAt(m.tx,m.tz)!==m.region||plotW(m.tx,m.tz)>0){m.tx=m.hx;m.tz=m.hz;}}else{vx=dx/d*1.6;vz=dz/d*1.6;}}
 m.x+=vx*dt;m.z+=vz*dt;const my=heightAt(m.x,m.z),mv=Math.abs(vx)+Math.abs(vz)>.05;
 if(mo.legL)animChibi(mo,dt,mv);else{mo.t+=dt*(mv?8:2);mo.body.position.y=mo.type==='wisp'?Math.sin(mo.t*.8)*.2:Math.abs(Math.sin(mo.t))*(mv?.1:.03);mo.legs.forEach((l,i)=>{l.rotation.x=mv?Math.sin(mo.t+i*Math.PI)*.5:0;});}
 if(m.st==='windup'&&mo.legL){mo.armR.rotation.x=-2.4;}
 if(mv)turnTo(mo,vx,vz,dt);mo.g.position.set(m.x,my,m.z);
 if(m.flash>0){m.flash-=dt;mo.g.scale.setScalar(m.baseS*1.15);}else mo.g.scale.setScalar(m.baseS);
 if(m.glow)m.glow.position.set(m.x,my+1.1+mo.body.position.y,m.z);
}

/* ---------- player pose and climbing ---------- */
function posePlayer(p,dt){
 const c=p.ch;
 if(p.climb){p.climbT+=dt*(p.climbMove?7:1.5);const s=Math.sin(p.climbT);c.armL.rotation.x=-2.6+s*.5;c.armR.rotation.x=-2.6-s*.5;c.legL.rotation.x=-.6+s*.4;c.legR.rotation.x=-.6-s*.4;c.body.rotation.x=-.25;return;}
 if(p.atkAnim>0){p.atkAnim-=dt;const k=1-Math.max(0,p.atkAnim)/.28;c.armR.rotation.x=-2.6+k*3.4;c.body.rotation.y=Math.sin(k*Math.PI)*.5;}else c.body.rotation.y*=.8;
 if(p.castAnim>0){p.castAnim-=dt;c.armL.rotation.x=-2.7;c.armR.rotation.x=-2.7;}
 if(!p.ground){c.legL.rotation.x=-.8;c.legR.rotation.x=.3;}
 c.body.rotation.x=p.dodgeT>0?.55:c.body.rotation.x*.8;
}
/** Peers only send an animation name; this approximates the pose. */
function poseChibi(c,anim,t){
 if(anim==='atk'){c.armR.rotation.x=-2.2+Math.sin(t*20)*1.2;}
 else if(anim==='cast'){c.armL.rotation.x=-2.7;c.armR.rotation.x=-2.7;}
 else if(anim==='jump'){c.legL.rotation.x=-.8;c.legR.rotation.x=.3;}
 else if(anim==='climb'){const s=Math.sin(t*7);c.armL.rotation.x=-2.6+s*.5;c.armR.rotation.x=-2.6-s*.5;}
 c.body.rotation.x=anim==='dodge'?.55:anim==='climb'?-.25:0;
}

/* ---------- live multiplayer (room capability; solo when absent) ---------- */
const NET={room:null,peers:new Map(),chat:[],sendT:0,last:'',open:false,uiT:0};
/** Peer-to-peer world for copies outside claude.ai (GitHub Pages, a downloaded file): WebRTC via Trystero over public Nostr relays. */
const P2P={lib:'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm',appId:'erandel-world-v1',room:'erandel'};
/** Wraps a Trystero room in the same calls the game uses from the claude.ai room (presence, emit, on, onPeers, connected). */
async function p2pRoom(){
 let mod;try{mod=await import(window.__P2P_LIB||P2P.lib);}catch(e){return null;}
 if(!mod||typeof mod.joinRoom!=='function')return null;
 let room;try{room=mod.joinRoom({appId:P2P.appId},P2P.room);}catch(e){return null;}
 const pres={},hs={},peerH=[],mine={},seen={};
 const snap=()=>Object.keys(pres).map(id=>({peer:id,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:pres[id],updatedAt:seen[id]||0}));
 const fire=()=>{const p=snap();peerH.forEach(h=>{try{h({peers:p,joined:[],left:[],updated:[]});}catch(e){}});};
 const small=d=>{try{return d&&typeof d==='object'&&JSON.stringify(d).length<=4096;}catch(e){return false;}};
 const act=n=>room.makeAction(n);const aP=act('pres'),aF=act('fx'),aC=act('chat');
 aP.onMessage=(d,c)=>{if(!small(d)||!c||!c.peerId)return;pres[c.peerId]=d;seen[c.peerId]=Date.now();fire();};
 const relay=t=>(d,c)=>{if(!small(d)||!c||!c.peerId)return;(hs[t]||[]).forEach(h=>{try{h({topic:t,data:d,peer:c.peerId,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false});}catch(e){}});};
 aF.onMessage=relay('fx');aC.onMessage=relay('chat');
 room.onPeerJoin=id=>{if(Object.keys(mine).length)aP.send(mine,{target:id}).catch(()=>{});};
 room.onPeerLeave=id=>{delete pres[id];fire();};
 return{p2p:true,
  presence:async p=>{Object.assign(mine,p);await aP.send(mine);},
  emit:async(t,d)=>{if(t==='fx')await aF.send(d);else if(t==='chat')await aC.send(d);},
  on:(t,h)=>{(hs[t]=hs[t]||[]).push(h);return()=>{};},
  onPeers:h=>{peerH.push(h);setTimeout(()=>h({peers:snap(),joined:[],left:[],updated:[]}),0);return()=>{};},
  connected:()=>true};
}
async function initNet(){
 try{
  let r=null;
  if(window.claude&&typeof window.claude.use==='function')r=await window.claude.use('room');
  if(!r)r=await p2pRoom();
  if(!r)return;NET.room=r;
  r.onPeers(ch=>netPeers(ch.peers),()=>{netClear();NET.room=null;render();});
  r.on('fx',netFxIn);r.on('chat',netChatIn);
  if(typeof r.onConnection==='function')r.onConnection(()=>renderNet());
  render();
 }catch(e){NET.room=null;}
}
function netClear(){NET.peers.forEach(o=>{if(W3&&o.ch)W3.scene.remove(o.ch.g);if(W3&&o.sg)W3.scene.remove(o.sg);});NET.peers.clear();}
function netPeers(list){
 const seen=new Set();
 list.forEach(pr=>{if(pr.sameTab||pr.kind!=='viewer')return;const d=sanitizePeer(pr.presence);if(!d)return;let o=NET.peers.get(pr.peer);if(!o){if(NET.peers.size>=24)return;o={id:pr.peer.replace(/[^a-z0-9]/gi,'').slice(0,24),ch:null,race:null,x:d.x,y:d.y,z:d.z};NET.peers.set(pr.peer,o);}o.d=d;seen.add(pr.peer);});
 NET.peers.forEach((o,k)=>{if(!seen.has(k)){if(W3&&o.ch)W3.scene.remove(o.ch.g);if(W3&&o.sg)W3.scene.remove(o.sg);NET.peers.delete(k);}});
 renderNet();
}
function netSend(dt){
 if(!NET.room)return;NET.sendT-=dt;if(NET.sendT>0)return;const p=W3.player;NET.sendT=p.anim==='idle'?1:.14;
 const pr=myPresence(p),s=JSON.stringify(pr);if(s===NET.last)return;NET.last=s;NET.room.presence(pr).catch(()=>{});
}
function netFx(d){if(!NET.room)return;const r=v=>Math.round(v*10)/10;const o={s:d.s,x:r(d.x),y:r(d.y),z:r(d.z),r:r(d.r||0)};if(d.e)o.e=d.e;if(d.tx!=null){o.tx=r(d.tx);o.tz=r(d.tz);}NET.room.emit('fx',o).catch(()=>{});}
function netFxIn(m){
 if(m.sameTab||!W3)return;const o=NET.peers.get(m.peer);if(!o)return;const now=Date.now();if(now-(o.fxT||0)<120)return;o.fxT=now;
 const d=sanitizeFx(m.data);if(!d||d.y<-20)return;const col=d.e?ELEM[d.e].c:'#d8f4ff';
 if(d.s==='slash')slashFx(d.x,d.y,d.z,d.r,col);
 else if(d.s==='bolt'){const dx=d.tx-d.x,dz=d.tz-d.z,dd=Math.hypot(dx,dz)||1;spawnProj({from:'peer',x:d.x,y:d.y+1.2,z:d.z,vx:dx/dd*16,vz:dz/dd*16,life:Math.min(1.2,dd/16),col,size:1.1});}
 else if(d.s==='wave')ringFx(d.x,d.y,d.z,ACT.skill.wave.r,col,.45);
 else if(d.s==='ritual'){const y=heightAt(d.tx,d.tz);setTimeout(()=>{if(W3){ringFx(d.tx,y,d.tz,ACT.skill.ritual.r,col,.5);burstFx(d.tx,y+1,d.tz,col,7);}},ACT.skill.ritual.delay*1000);}
 else if(d.s==='summon'){o.summonUntil=now+ACT.skill.summon.dur*1000;o.summonCol=col;}
}
function netChatIn(m){
 if(m.sameTab)return;const t=cleanText(m.data&&m.data.t,80);if(!t)return;const o=NET.peers.get(m.peer),now=Date.now();
 if(o){if(now-(o.chatT||0)<800)return;o.chatT=now;o.say=t;o.sayUntil=now+6000;}

function addChat(n,t,me){NET.chat.push({n,t,me,at:Date.now()});if(NET.chat.length>30)NET.chat.shift();renderNet();}
function sendChat(text){
 const t=cleanText(text,80);if(!t||!NET.room)return;NET.room.emit('chat',{t}).catch(()=>toast('Your message could not be sent.'));
 addChat(S.name,t,true);if(W3){W3.player.say=t;W3.player.sayUntil=Date.now()+6000;}

function updatePeers(dt,t){
 const w=W3,now=Date.now();
 NET.peers.forEach(o=>{const d=o.d;if(!d)return;
  if(o.race!==d.race){if(o.ch)w.scene.remove(o.ch.g);o.race=d.race;o.ch=makeChibi(charSpec(d.race),1.2);w.scene.add(o.ch.g);o.x=d.x;o.y=d.y;o.z=d.z;}
  const k=Math.min(1,dt*8),ox=o.x,oz=o.z;o.x+=(d.x-o.x)*k;o.y+=(d.y-o.y)*k;o.z+=(d.z-o.z)*k;

  let dr=d.ry-o.ch.g.rotation.y;while(dr>Math.PI)dr-=Math.PI*2;while(dr<-Math.PI)dr+=Math.PI*2;o.ch.g.rotation.y+=dr*Math.min(1,dt*10);
  animChibi(o.ch,dt,mv&&d.anim!=='jump');poseChibi(o.ch,d.anim,t);o.ch.g.position.set(o.x,o.y,o.z);
  if(o.summonUntil>now){if(!o.sg){o.sg=mkGlow(o.summonCol,1.3,.95);w.scene.add(o.sg);}const a=t*2.4;o.sg.position.set(o.x+Math.cos(a)*1.3,o.y+1.9,o.z+Math.sin(a)*1.3);}
  else if(o.sg){w.scene.remove(o.sg);o.sg=null;}
 });
}
function renderNet(){

 const b=document.getElementById('b-net'),n=1+NET.peers.size;

/* ---------- painted textures (generated in code, no image files) ---------- */
/** A tiling hand-painted texture: base wash, brush streaks and speckle, in grey so vertex colours tint it. */
function paintTex(kind){
 const S2=256,cv=document.createElement('canvas');cv.width=cv.height=S2;const x=cv.getContext('2d'),r=mulberry(kind==='rock'?31:kind==='grass'?17:5);
 x.fillStyle='#d8d8d8';x.fillRect(0,0,S2,S2);
 const wrap=(f)=>{for(const ox of[-S2,0,S2])for(const oy of[-S2,0,S2]){x.save();x.translate(ox,oy);f();x.restore();}};
 if(kind==='rock'){
  for(let i=0;i<70;i++){const px=r()*S2,py=r()*S2,len=30+r()*90,wd=2+r()*7,g=90+r()*120|0;const a=`rgba(${g},${g},${g},${.25+r()*.35})`;wrap(()=>{x.strokeStyle=a;x.lineWidth=wd;x.lineCap='round';x.beginPath();x.moveTo(px,py);x.bezierCurveTo(px+(r()-.5)*14,py+len*.3,px+(r()-.5)*14,py+len*.7,px+(r()-.5)*8,py+len);x.stroke();});}
  for(let i=0;i<26;i++){const px=r()*S2,py=r()*S2,w2=20+r()*60;const g=235+r()*20|0;wrap(()=>{x.strokeStyle=`rgba(${g},${g},${g},.55)`;x.lineWidth=1.5+r()*2;x.beginPath();x.moveTo(px,py);x.lineTo(px+w2,py+(r()-.5)*6);x.stroke();});}

}
function evoText(){
 if(S.tier>=4)return `You have become ${S.legendName}. There is no higher form, only what you do with this one.`;
 const reqs=evoReqs(S.tier+1);const r=R();const lean=S.tier===1?r.paths[bestPath()].n:title();
 return `You are ${S.tier===1?'leaning toward '+lean:lean}. To reach the next form at dawn you still need: ${reqs.filter(x=>!x.ok).map(x=>x.l.toLowerCase()).join('; ')||'nothing more. Sleep, and wake changed'}.`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,g=b.dataset.arg;
 switch(a){
  case'pick':ui.pick=g;render();break;
  case'random':ui.pick=pick(Object.keys(RACES));render();break;
  case'begin':{
   newChar((ui.cname||'').trim().slice(0,24)||'Wanderer',ui.pick);S.pos={x:SPAWN.x,z:SPAWN.z};window.__teleport=true;applyStarter();
   if(W3){Object.values(W3.itemMeshes).forEach(m=>W3.buildGroup.remove(m));W3.itemMeshes={};W3.glows=W3.glows.filter(o=>!o.item);W3.LIGHTS=W3.LIGHTS.filter(o=>!o.item);S.build.forEach(addItemMesh);}
   ui.screen='game';ui.tab='act';ui.confirm=false;ui.journal=false;
   ui.dialog=HAS3D?{type:'ael',text:`Welcome, ${S.name} the ${R().sing}. Erandel lies north, through this gate. ${IS_PHONE?'Move with the stick and drag the screen to look around. Attack, Jump, Dodge and your spells are on the right.':'Move with W A S D and drag with the mouse to look around. Space jumps, F attacks, Shift dodges, 1 to 4 cast your spells, E talks.'} Steep rock can be climbed. The lantern plot east of the road is yours: build on it with the hammer, and open a night market for travelers.${spawnTip()?' '+spawnTip():''}`,page:-1}:null;
   save();render();break;}
  case'tab':ui.tab=g;ui.confirm=false;render();break;
  case'travel':doAction('travel',ui.travel);break;
  case'practice':doAction('practice',ui.prac);break;
  case'job':doAction('job',ui.job||'blacksmith');break;
  case'forge':doAction('forge');break;
  case'eat':doAction('eat',ui.food);break;
  case'sleep-ask':ui.dialog={type:'sleep'};render();break;
  case'sleep':
   if(ui.market)closeMarket('you went to sleep');
   ui.journal=false;ui.dialog=null;ui.build=null;ui.fadeText=`Dawn · Day ${S.day+1}`;render();
   setTimeout(()=>{sleep();setTimeout(()=>{ui.fadeText='';render();},900);},550);break;
  case'reset':ui.confirm=true;render();break;
  case'reset-no':ui.confirm=false;render();break;
  case'reset-yes':if(ui.market)ui.market=null;if(W3)despawnCustomers();S=null;try{localStorage.removeItem(SAVE_KEY);}catch(err){}ui.screen='create';ui.confirm=false;ui.journal=false;ui.dialog=null;ui.build=null;render();break;
  case'journal-open':ui.journal=true;ui.settings=false;render();break;
  case'journal-close':ui.journal=false;render();break;
  case'dlg-close':ui.dialog=null;render();break;
  case'dlg-help':dlgAct('help',g);break;
  case'dlg-trade':dlgAct('trade',g);break;
  case'dlg-steal':dlgAct('steal',g);break;
  case'ael-lore':{const d=ui.dialog;d.page=(d.page+1)%AEL_LORE.length;d.text=AEL_LORE[d.page];render();break;}
  case'ael-evo':ui.dialog.text=evoText();render();break;
  case'ael-bless':{
   if(S.flags.blessDay===S.day)break;S.flags.blessDay=S.day;const c=cure(['sick','burned','chilled']);S.hp=hpMax();addFate(1);
   OUT=[];L(`Aelarion’s green light washes over you. Fully healed${c.length?`, no longer ${c.join(', ')}`:''}. Fate +1.`,'good');flush();
   ui.dialog.text='Go with the light of the boughs. Come back tomorrow if the road is hard.';save();render();break;}
  case'market-close':closeMarket('you closed it');break;
  case'build-open':if(!HAS3D)break;if(S.region!=='vael'){toast('You can build on your plot in Thorngate.');break;}ui.build={sel:ui.lastSel||'lantern',rot:0,tool:'place'};ui.journal=false;ui.dialog=null;ui.settings=false;W3.buildCam={x:18,z:38};W3.hover=null;render();break;
  case'build-close':ui.build=null;render();break;
  case'b-sel':ui.build.sel=g;ui.lastSel=g;ui.build.tool='place';render();break;
  case'b-rotate':ui.build.rot=(ui.build.rot+1)%4;ui.build.tool='place';render();break;
  case'b-remove':ui.build.tool=ui.build.tool==='remove'?'place':'remove';render();break;
  case'photo':ui.photo=true;ui.settings=false;document.body.classList.add('photo');render();break;
  case'settings':ui.settings=!ui.settings;render();break;
  case'set-glow':PREFS.glow=!PREFS.glow;savePrefs();if(W3)setupComposer();render();break;
  case'set-tilt':PREFS.tilt=!PREFS.tilt;savePrefs();render();break;
  case'm-play':if(MUS.playing)mPause();else mPlay();render();break;
  case'm-next':mSkip(1);render();break;
  case'm-prev':mSkip(-1);render();break;
  default:doAction(a,g);
 }
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.bind){ui[el.dataset.bind]=el.value;if(el.tagName==='SELECT')render();}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='vol'){PREFS.vol=+el.value;savePrefs();if(MUS.master)MUS.master.gain.value=PREFS.vol*.5;return;}if(el.dataset&&el.dataset.bind&&el.tagName==='INPUT')ui[el.dataset.bind]=el.value;});
document.addEventListener('keydown',e=>{
 const tg=e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
 const k=e.key.toLowerCase();
 if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);if(k.startsWith('arrow'))e.preventDefault();}
 if(!S||ui.screen!=='game')return;
 if(k==='escape'&&NET.open){openChat(false);return;}
 if(k==='escape'){if(ui.photo){ui.photo=false;document.body.classList.remove('photo');}else if(ui.dialog)ui.dialog=null;else if(ui.build)ui.build=null;else if(ui.journal)ui.journal=false;else ui.settings=false;render();}
 if((k==='e'||k==='enter')&&!ui.dialog&&!ui.journal&&!ui.build&&W3&&W3.talk){e.preventDefault();openTalk(W3.talk);}
 if(W3&&HAS3D){
  if(k===' '){e.preventDefault();if(!e.repeat)playerJump();}
  if(k==='shift'&&!e.repeat)playerDodge();
  if(k==='f')playerAttack();
  if(['1','2','3','4'].includes(k))castSkill(+k-1);
  if(k==='t'&&NET.room&&!ui.dialog&&!ui.journal&&!ui.build){e.preventDefault();openChat(true);}
 }
 if((k==='m'||k==='j')&&!ui.dialog&&!ui.build){ui.journal=!ui.journal;render();}
 if(k==='r'&&ui.build){ui.build.rot=(ui.build.rot+1)%4;render();}
 if(k==='b'&&!ui.dialog&&!ui.journal){if(ui.build)ui.build=null;else if(S.region==='vael'&&HAS3D){ui.build={sel:ui.lastSel||'lantern',rot:0,tool:'place'};W3.buildCam={x:18,z:38};}render();}
});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
(function(){
 const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null;
 const move=e=>{const r=st.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);const m=Math.hypot(x,y),R0=r.width/2-14;if(m>R0){x=x/m*R0;y=y/m*R0;}kn.style.transform=`translate(${x}px,${y}px)`;stick.x=x/R0;stick.y=y/R0;};
 st.addEventListener('pointerdown',e=>{id=e.pointerId;try{st.setPointerCapture(id);}catch(err){}move(e);e.preventDefault();});
 st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e);});
 const end=e=>{if(e.pointerId!==id)return;id=null;stick.x=0;stick.y=0;kn.style.transform='';};
 st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
 document.getElementById('b-talk').addEventListener('click',()=>{if(W3&&W3.talk)openTalk(W3.talk);});
 const bind=(b,fn)=>{b.addEventListener('pointerdown',e=>{e.preventDefault();fn();});b.addEventListener('click',e=>{if(e.detail===0)fn();});};
 bind(document.getElementById('b-atk'),()=>playerAttack());bind(document.getElementById('b-jump'),()=>playerJump());bind(document.getElementById('b-dodge'),()=>playerDodge());
 document.querySelectorAll('#btns .sk').forEach(b=>bind(b,()=>castSkill(+b.dataset.slot)));
 document.getElementById('b-net').addEventListener('click',()=>openChat(!NET.open));
 document.getElementById('chatbar').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('chatin');sendChat(i.value);i.value='';});
})();
function openChat(on){NET.open=!!(on&&NET.room);keys.clear();stick.x=0;stick.y=0;render();renderNet();if(NET.open)setTimeout(()=>{const i=document.getElementById('chatin');if(i)i.focus();},30);}

function start(data){
 data=data||{};
 const fromLocal=loadSaved();
 if(data.S&&valid(data.S)){S=data.S;if(data.codex)CODEX=data.codex;}else S=fromLocal;
 if(S){ui.screen='game';if(data.ui)ui.tab=data.ui.tab||'act';if(!S.flags.starter&&!S.build.length)applyStarter();}
 if(HAS3D){try{initWorld();}catch(err){HAS3D=false;console.error(err);}}
 render();
 if(HAS3D)initNet();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S,codex:CODEX,ui:{tab:ui.tab}}));}catch(e){}}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data?window.claude.hot.data:{});

</script>
